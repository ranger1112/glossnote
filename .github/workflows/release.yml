name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的标签（例如 v0.1.0）
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # beforeBuildCommand 会先跑 npm run build（类型检查 + 前端构建）。
      - name: 构建 NSIS 安装包
        run: npx tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成 SHA-256 校验文件
        shell: bash
        run: |
          cd src-tauri/target/release/bundle/nsis
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 上传安装包到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          NOTES=".github/release-notes/${TAG}.md"
          [ -f "$NOTES" ] || NOTES="CHANGELOG.md"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "GlossNote ${TAG#v}" --notes-file "$NOTES"
          gh release upload "$TAG" \
            src-tauri/target/release/bundle/nsis/*.exe \
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt \
            --clobber
