name: 功能建议
description: 提出新功能或体验改进
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先看 docs/product-design.md 的「非目标」，避免提出与当前范围冲突的需求。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 描述场景和痛点，而不是直接给方案
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你希望的解决方式
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 阅读与标注
        - 书库与搜索
        - 同步与数据
        - 卡片与复习
        - AI
        - 构建与发布
        - 其他
    validations:
      required: true
